<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery: Onboarding redesign</title>
    <!-- Conductor template. Self-contained: keep assets next to this file and link them by relative path. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #fafafa;
        --surface-2: #f4f4f5;
        --surface-3: #e4e4e7;
        --fg: #1a1a1e;
        --muted: #71717a;
        --faint: #a1a1aa;
        --border: #e4e4e7;
        --accent: #20744a;
        --accent-soft: #20744a14;
        --accent-fg: #ffffff;
        --ok: #20744a;
        --warn: #b7791f;
        --bad: #b04138;
        --info: #2563eb;
        --radius: 12px;
        --radius-sm: 8px;
        --font:
          Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141716;
          --surface: #181b1a;
          --surface-2: #1e2120;
          --surface-3: #272a29;
          --fg: #eceeed;
          --muted: #a1a5a4;
          --faint: #717574;
          --border: #252b2a;
          --accent: #7ccba0;
          --accent-soft: #7ccba01a;
          --accent-fg: #0f1211;
          --ok: #7ccba0;
          --warn: #e0b25c;
          --bad: #e07a6f;
          --info: #7aa7f0;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }
      header.top {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 32px;
      }
      .eyebrow {
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }
      h1 {
        font-size: clamp(28px, 4vw, 38px);
        line-height: 1.15;
        margin: 0;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 22px;
        line-height: 1.3;
        margin: 0 0 12px;
        letter-spacing: -0.01em;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 12px;
      }
      .lede {
        font-size: 18px;
        color: var(--muted);
        max-width: 68ch;
      }
      a {
        color: var(--accent);
      }
      code {
        font: 14px/1.5 var(--mono);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 5px;
      }
      pre {
        font: 14px/1.55 var(--mono);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        overflow: auto;
      }
      pre code {
        background: none;
        border: 0;
        padding: 0;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        color: var(--muted);
        font-size: 14px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--muted);
        white-space: nowrap;
      }
      .chip.ok {
        color: var(--ok);
        border-color: color-mix(in srgb, var(--ok) 40%, transparent);
        background: color-mix(in srgb, var(--ok) 10%, transparent);
      }
      .chip.warn {
        color: var(--warn);
        border-color: color-mix(in srgb, var(--warn) 40%, transparent);
        background: color-mix(in srgb, var(--warn) 10%, transparent);
      }
      .chip.bad {
        color: var(--bad);
        border-color: color-mix(in srgb, var(--bad) 40%, transparent);
        background: color-mix(in srgb, var(--bad) 10%, transparent);
      }
      .chip.info {
        color: var(--info);
        border-color: color-mix(in srgb, var(--info) 40%, transparent);
        background: color-mix(in srgb, var(--info) 10%, transparent);
      }
      .callout {
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        background: var(--accent-soft);
        border-radius: var(--radius-sm);
        padding: 12px 16px;
      }
      .callout.warn {
        border-left-color: var(--warn);
        background: color-mix(in srgb, var(--warn) 8%, transparent);
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
        font-size: 15px;
      }
      th,
      td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        background: var(--surface-2);
        font-size: 13px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--muted);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .table-scroll {
        overflow-x: auto;
      }
      footer {
        margin-top: 48px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        color: var(--faint);
        font-size: 13px;
      }
      @media (max-width: 600px) {
        .wrap {
          padding: 24px 16px 56px;
        }
        .card {
          padding: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }
      .filters button {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }
      .filters button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      .tiles {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      }
      .tile {
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .tile button.open {
        all: unset;
        cursor: zoom-in;
        display: block;
        aspect-ratio: 16/10;
        background: var(--surface-2);
      }
      .tile img,
      .tile video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .tile figcaption {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .tile figcaption span {
        color: var(--muted);
        font-size: 14px;
      }
      .tile[hidden] {
        display: none;
      }
      dialog {
        border: 0;
        padding: 0;
        background: transparent;
        max-width: min(1100px, 94vw);
        max-height: 92vh;
      }
      dialog::backdrop {
        background: #000c;
      }
      dialog img,
      dialog video {
        max-width: 100%;
        max-height: 82vh;
        border-radius: var(--radius-sm);
        display: block;
        margin: 0 auto;
      }
      dialog p {
        color: #eee;
        text-align: center;
        margin: 10px 0 0;
      }
      dialog .close {
        position: fixed;
        top: 16px;
        right: 16px;
        font: inherit;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #fff4;
        background: #0008;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <span class="eyebrow">Gallery</span>
        <h1>Onboarding redesign: screens and demo</h1>
        <p class="lede">
          Tap any tile to see it full size. Put images and videos in an
          <code>assets/</code> folder next to this file.
          <!-- EDIT -->
        </p>
      </header>
      <div class="filters" role="group" aria-label="Filter">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="screen" aria-pressed="false">
          Screens
        </button>
        <button type="button" data-filter="video" aria-pressed="false">
          Videos
        </button>
      </div>
      <div class="tiles">
        <!-- EDIT: one <figure> per item; data-kind is screen or video. -->
        <figure class="tile" data-kind="screen">
          <button class="open" type="button" aria-label="Open Welcome screen">
            <img src="assets/welcome.png" alt="Welcome screen" loading="lazy" />
          </button>
          <figcaption>
            <strong>Welcome</strong
            ><span>New headline and one clear button.</span>
          </figcaption>
        </figure>
        <figure class="tile" data-kind="screen">
          <button
            class="open"
            type="button"
            aria-label="Open Permissions screen"
          >
            <img
              src="assets/permissions.png"
              alt="Permissions screen"
              loading="lazy"
            />
          </button>
          <figcaption>
            <strong>Permissions</strong><span>Asks only when needed.</span>
          </figcaption>
        </figure>
        <figure class="tile" data-kind="video">
          <button class="open" type="button" aria-label="Play walkthrough">
            <video
              src="assets/walkthrough.mp4"
              muted
              playsinline
              preload="metadata"
            ></video>
          </button>
          <figcaption>
            <strong>Walkthrough</strong><span>45 s, full flow on a phone.</span>
          </figcaption>
        </figure>
      </div>
      <footer>Made with a Conductor template</footer>
    </div>
    <dialog id="viewer" aria-label="Viewer">
      <button class="close" type="button">Close</button>
      <div id="viewer-body"></div>
      <p id="viewer-caption"></p>
    </dialog>
    <script>
      const viewer = document.getElementById("viewer"),
        body = document.getElementById("viewer-body"),
        cap = document.getElementById("viewer-caption");
      document.querySelectorAll(".tile .open").forEach((btn) =>
        btn.addEventListener("click", () => {
          const media = btn.firstElementChild.cloneNode(true);
          if (media.tagName === "VIDEO") {
            media.controls = true;
            media.muted = false;
            media.autoplay = true;
          }
          body.replaceChildren(media);
          cap.textContent = btn
            .closest("figure")
            .querySelector("strong").textContent;
          viewer.showModal();
        }),
      );
      viewer
        .querySelector(".close")
        .addEventListener("click", () => viewer.close());
      viewer.addEventListener("close", () => body.replaceChildren());
      viewer.addEventListener("click", (e) => {
        if (e.target === viewer) viewer.close();
      });
      document.querySelectorAll(".filters button").forEach((b) =>
        b.addEventListener("click", () => {
          document
            .querySelectorAll(".filters button")
            .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
          document
            .querySelectorAll(".tile")
            .forEach(
              (t) =>
                (t.hidden =
                  b.dataset.filter !== "all" &&
                  t.dataset.kind !== b.dataset.filter),
            );
        }),
      );
    </script>
  </body>
</html>
